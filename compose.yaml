services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: sentinel_grid
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "5432:5432"
    volumes:
      - sentinel-postgres:/var/lib/postgresql/data
      # The entrypoint ignores mounted directories, so the SQL trees are
      # mounted outside initdb.d and applied by the loader script below.
      - ./database/migrations:/sentinel-sql/migrations:ro
      - ./database/seed:/sentinel-sql/seed:ro
      - ./database/docker/30-apply-sql.sh:/docker-entrypoint-initdb.d/30-apply-sql.sh:ro
    healthcheck:
      # pg_isready on the socket turns green while the initdb scripts are
      # still running on the temporary server, so the probe requires both a
      # TCP listener (only the final server opens one) and a seeded schema.
      test:
        - CMD-SHELL
        - >-
          pg_isready -h 127.0.0.1 -p 5432 -U sentinel -d sentinel_grid &&
          psql -U sentinel -d sentinel_grid -tAc
          'SELECT 1 FROM patrol_unit_snapshots LIMIT 1' >/dev/null
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 60s

volumes:
  sentinel-postgres:
