[package]
name = "sentinel-telemetry-gateway"
version = "0.1.0"
edition = "2021"
description = "Communication boundary that turns untrusted telemetry frames into validated events"
publish = false

[dependencies]
axum = "0.7"
chrono = { version = "0.4.38", features = ["serde"] }
redis = { version = "0.27", features = ["connection-manager", "tokio-comp"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tokio-postgres = "0.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3", features = ["json"] }
uuid = { version = "1", features = ["v4"] }

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
