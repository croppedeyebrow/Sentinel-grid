[package]
name = "sentinel-telemetry-gateway"
version = "0.1.0"
edition = "2021"
description = "Communication boundary that turns untrusted telemetry frames into validated events"
publish = false

[dependencies]
chrono = { version = "0.4.38", features = ["serde"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
all = "warn"
