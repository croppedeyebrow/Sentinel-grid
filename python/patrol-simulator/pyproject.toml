[project]
name = "patrol-simulator"
version = "0.1.0"
description = "Deterministic patrol telemetry simulator with fault injection"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyyaml>=6.0"]

[project.scripts]
patrol-simulator = "patrol_simulator.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/patrol_simulator"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
